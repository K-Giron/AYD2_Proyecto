<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#FFFFFF"/>
  <text x="600" y="68" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#000000">Modelo físico - Almacén central (tablas restantes)</text>
  <g font-family="Arial, sans-serif" fill="#000000">
    <rect x="90" y="140" width="470" height="350" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="105" y="172" font-size="16" font-weight="700">invoices</text>
    <line x1="105" y1="184" x2="545" y2="184" stroke="#000000" stroke-width="1"/>
    <text x="105" y="211" font-size="14"><tspan font-weight="700">PK</tspan><tspan dx="6">id : uuid</tspan></text>
    <text x="105" y="237" font-size="14">invoice_type : varchar(16)</text>
    <text x="105" y="263" font-size="14">counterparty : varchar(160)</text>
    <text x="105" y="289" font-size="14">description : varchar(255)</text>
    <text x="105" y="315" font-size="14">amount : numeric(12,2)</text>
    <text x="105" y="341" font-size="14">related_folio : varchar(16)</text>
    <text x="105" y="367" font-size="14">due_date : date</text>
    <text x="105" y="393" font-size="14">status : varchar(16)</text>
    <text x="105" y="419" font-size="14">created_at : timestamptz</text>
    <text x="105" y="445" font-size="14">paid_at : timestamptz</text>

    <rect x="640" y="140" width="470" height="280" fill="#FFFFFF" stroke="#000000" stroke-width="2"/>
    <text x="655" y="172" font-size="16" font-weight="700">audit_log_entries</text>
    <line x1="655" y1="184" x2="1095" y2="184" stroke="#000000" stroke-width="1"/>
    <text x="655" y="211" font-size="14"><tspan font-weight="700">PK</tspan><tspan dx="6">id : uuid</tspan></text>
    <text x="655" y="237" font-size="14">event_type : varchar(48)</text>
    <text x="655" y="263" font-size="14">description : varchar(500)</text>
    <text x="655" y="289" font-size="14">related_folio : varchar(24)</text>
    <text x="655" y="315" font-size="14">point_of_sale_id : uuid</text>
    <text x="655" y="341" font-size="14">actor : varchar(160)</text>
    <text x="655" y="367" font-size="14">occurred_at : timestamptz</text>

    <rect x="180" y="550" width="840" height="70" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
    <text x="600" y="579" text-anchor="middle" font-size="15" font-style="italic">Sin conectores: related_folio es una referencia informativa y</text>
    <text x="600" y="603" text-anchor="middle" font-size="15" font-style="italic">point_of_sale_id no tiene una restricción FK en Flyway.</text>
  </g>
</svg>
