<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="white"/><text x="800" y="60" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">Fase 3 — opciones y Saga financiera dual</text><g fill="white" stroke="black" stroke-width="3"><rect x="80" y="120" width="260" height="70"/><rect x="470" y="120" width="260" height="70"/><rect x="860" y="120" width="260" height="70"/><rect x="1250" y="120" width="260" height="70"/><rect x="80" y="260" width="650" height="170"/><rect x="860" y="260" width="650" height="190"/><rect x="80" y="530" width="650" height="170"/><rect x="860" y="530" width="650" height="190"/></g><g font-family="Arial" fill="black" text-anchor="middle" font-size="21"><text x="210" y="163">Cliente / UI</text><text x="600" y="163">orders / Saga</text><text x="990" y="163">credit</text><text x="1380" y="163">payments / fiscal</text></g><g font-family="Arial" fill="black" font-size="20"><text x="110" y="300"><tspan x="110" font-weight="bold">1. GET payment-options</tspan><tspan x="110" dy="32">orders obtiene dueño y total persistidos</tspan><tspan x="110" dy="32">evaluate tiene timeout de 2 s</tspan><tspan x="110" dy="32">falla / demora / rechazo ⇒ solo PAYKLIK</tspan></text><text x="890" y="300"><tspan x="890" font-weight="bold">2A. Ruta OWN_CREDIT</tspan><tspan x="890" dy="32">reserva → CREDIT_PENDING → requestCredit</tspan><tspan x="890" dy="32">GRANTED → fiscal → CONFIRMED</tspan><tspan x="890" dy="32">REJECTED: sin deuda; permite PAYKLIK</tspan></text><text x="110" y="570"><tspan x="110" font-weight="bold">2B. Ruta PAYKLIK</tspan><tspan x="110" dy="32">reserva → PAYMENT_PENDING → cobro</tspan><tspan x="110" dy="32">PAYMENT_APPROVED → fiscal → CONFIRMED</tspan><tspan x="110" dy="32">PayKlik nunca se invoca en OWN_CREDIT</tspan></text><text x="890" y="570"><tspan x="890" font-weight="bold">Reintento y concurrencia</tspan><tspan x="890" dy="32">• misma llave ⇒ mismos identificadores</tspan><tspan x="890" dy="32">• UNIQUE + advisory locks transaccionales</tspan><tspan x="890" dy="32">• Outbox / Inbox evita consumo duplicado</tspan></text></g><g fill="none" stroke="black" stroke-width="3" marker-end="url(#a)"><path d="M340 155H470"/><path d="M730 155H860"/><path d="M1120 155H1250"/></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="black"/></marker></defs></svg>
