<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="white"/><text x="800" y="60" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">Fase 3 — propiedad de datos e idempotencia</text><g fill="white" stroke="black" stroke-width="3"><rect x="70" y="160" width="350" height="170"/><rect x="625" y="140" width="350" height="210"/><rect x="1180" y="120" width="350" height="250"/><rect x="340" y="520" width="360" height="190"/><rect x="900" y="520" width="360" height="190"/><rect x="340" y="790" width="920" height="75" stroke-dasharray="9 8"/></g><g font-family="Arial" fill="black" font-size="19"><text x="95" y="200"><tspan x="95" font-weight="bold">credit_customer_profiles</tspan><tspan x="95" dy="32">PK customer_id</tspan><tspan x="95" dy="32">historial proyectado</tspan><tspan x="95" dy="32">updated_at</tspan></text><text x="650" y="180"><tspan x="650" font-weight="bold">credit_decisions</tspan><tspan x="650" dy="32">PK decision_id · FK customer_id</tspan><tspan x="650" dy="32">eligible · approved_limit</tspan><tspan x="650" dy="32">rule_version · reason_code</tspan><tspan x="650" dy="32">entradas evaluadas</tspan></text><text x="1205" y="160"><tspan x="1205" font-weight="bold">credit_operations</tspan><tspan x="1205" dy="32">PK credit_operation_id</tspan><tspan x="1205" dy="32">FK decision_id · customer_id</tspan><tspan x="1205" dy="32">UNIQUE order_id · idempotency_key</tspan><tspan x="1205" dy="32">status · amount · due_date</tspan></text><text x="365" y="560"><tspan x="365" font-weight="bold">customer_orders</tspan><tspan x="365" dy="34">payment_route</tspan><tspan x="365" dy="34">financial_operation_id</tspan><tspan x="365" dy="34">financial_operation_type</tspan></text><text x="925" y="560"><tspan x="925" font-weight="bold">fiscal_documents</tspan><tspan x="925" dy="34">financial_operation_id</tspan><tspan x="925" dy="34">financial_operation_type</tspan><tspan x="925" dy="34">payment_attempt_id nullable</tspan></text><text x="800" y="820" text-anchor="middle"><tspan x="800">REJECTED conserva trazabilidad, pero due_date es nulo y no representa deuda.</tspan><tspan x="800" dy="27">PostgreSQL es compartido físicamente; cada módulo conserva propiedad lógica.</tspan></text></g><g fill="none" stroke="black" stroke-width="3" marker-end="url(#a)"><path d="M420 245H625"/><path d="M975 245H1180"/><path d="M1355 370L700 560"/><path d="M700 615H900"/></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="black"/></marker></defs></svg>
