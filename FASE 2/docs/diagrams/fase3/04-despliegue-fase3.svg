<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="white"/><text x="800" y="60" text-anchor="middle" font-family="Arial" font-size="30" font-weight="bold">Fase 3 — topología Docker Compose local y GCP</text><g fill="white" stroke="black" stroke-width="3"><rect x="60" y="330" width="230" height="130" rx="12"/><rect x="430" y="250" width="380" height="270"/><ellipse cx="1070" cy="180" rx="150" ry="35"/><rect x="920" y="180" width="300" height="125"/><ellipse cx="1070" cy="305" rx="150" ry="35"/><ellipse cx="1070" cy="440" rx="150" ry="35"/><rect x="920" y="440" width="300" height="125"/><ellipse cx="1070" cy="565" rx="150" ry="35"/><rect x="1310" y="280" width="250" height="220" rx="12"/><rect x="390" y="690" width="850" height="105" stroke-dasharray="9 8"/></g><g font-family="Arial" fill="black" text-anchor="middle" font-size="20"><text x="175" y="380"><tspan x="175" font-weight="bold">Navegador</tspan><tspan x="175" dy="32">frontend :8081</tspan></text><text x="620" y="300"><tspan x="620" font-weight="bold">backend :8080</tspan><tspan x="620" dy="34">Spring Modulith</tspan><tspan x="620" dy="34">orders + credit + fiscal</tspan><tspan x="620" dy="34">+ notifications</tspan><tspan x="620" dy="34">una unidad de despliegue</tspan></text><text x="1070" y="215"><tspan x="1070" font-weight="bold">PostgreSQL</tspan><tspan x="1070" dy="32">sgo_logic</tspan><tspan x="1070" dy="32">propiedad modular</tspan></text><text x="1070" y="480"><tspan x="1070" font-weight="bold">RabbitMQ</tspan><tspan x="1070" dy="32">exchange + DLQ</tspan></text><text x="1435" y="325"><tspan x="1435" font-weight="bold">Servicios existentes</tspan><tspan x="1435" dy="35">PayKlik :8086</tspan><tspan x="1435" dy="35">LogiExpress :8085</tspan><tspan x="1435" dy="35">Inventory :8082</tspan><tspan x="1435" dy="35">SAT / SMTP</tspan></text><text x="815" y="730"><tspan x="815">credit no es microservicio: no tiene imagen, proceso ni base independiente.</tspan><tspan x="815" dy="31">La topología Compose se ejecuta en GCP y GitHub Actions controla su despliegue.</tspan></text></g><g fill="none" stroke="black" stroke-width="3" marker-end="url(#a)"><path d="M290 395H430"/><path d="M810 320L920 240"/><path d="M810 440H920"/><path d="M810 385H1310"/></g><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="black"/></marker></defs></svg>
