spring:
  datasource:
    url: ${TEST_DATABASE_URL:}
    username: ${TEST_DATABASE_USERNAME:}
    password: ${TEST_DATABASE_PASSWORD:}
  rabbitmq:
    host: ${TEST_RABBITMQ_HOST:localhost}
    port: ${TEST_RABBITMQ_PORT:5672}
    username: ${TEST_RABBITMQ_USERNAME:test}
    password: ${TEST_RABBITMQ_PASSWORD:test}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  health:
    rabbit:
      enabled: true

sgo:
  messaging:
    outbox:
      enabled: false
    consumers:
      enabled: false
  outbox:
    poll-interval-ms: 86400000
  security:
    # Las pruebas de negocio no envían token; la prueba de seguridad lo
    # habilita explícitamente con @TestPropertySource.
    enabled: false
  payments:
    reconciliation:
      # La conciliación se invoca manualmente en las pruebas.
      poll-interval-ms: 86400000
