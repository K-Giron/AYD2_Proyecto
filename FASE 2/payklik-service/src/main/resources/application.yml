spring:
  application:
    name: payklik-service
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  datasource:
    url: jdbc:postgresql://${PAYKLIK_POSTGRES_HOST:localhost}:${PAYKLIK_POSTGRES_PORT:5432}/${PAYKLIK_POSTGRES_DB:payklik_local}
    username: ${PAYKLIK_POSTGRES_USER:payklik_local}
    password: ${PAYKLIK_POSTGRES_PASSWORD:local_only_change_me}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
          no-store: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

payklik:
  # Comercio afiliado y su llave para la API de autorizaciones (X-Api-Key). Un solo
  # comercio en esta instalación: MegaStore.
  merchant: ${PAYKLIK_MERCHANT:MegaStore}
  api-key: ${PAYKLIK_MERCHANT_API_KEY:local_only_payklik_key}
