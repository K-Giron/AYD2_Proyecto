spring:
  application:
    name: logiexpress-service
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  datasource:
    url: jdbc:postgresql://${LOGIEXPRESS_POSTGRES_HOST:localhost}:${LOGIEXPRESS_POSTGRES_PORT:5432}/${LOGIEXPRESS_POSTGRES_DB:logiexpress_local}
    username: ${LOGIEXPRESS_POSTGRES_USER:logiexpress_local}
    password: ${LOGIEXPRESS_POSTGRES_PASSWORD:local_only_change_me}
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true
          no-store: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logiexpress:
  # Comercio afiliado y su llave para la API de guías (X-Api-Key). Un solo
  # comercio en esta instalación: MegaStore.
  merchant: ${LOGIEXPRESS_MERCHANT:MegaStore}
  api-key: ${LOGIEXPRESS_MERCHANT_API_KEY:local_only_logiexpress_key}
