name: QA - Integracion base Fase 2

on:
  pull_request:
    paths:
      - "FASE 2/backend/**"
      - "FASE 2/tests/smoke/**"
      - "FASE 2/docker-compose.yml"
      - "FASE 2/.env.example"
      - ".github/workflows/qa-integracion-base.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "FASE 2/backend/**"
      - "FASE 2/tests/smoke/**"
      - "FASE 2/docker-compose.yml"
      - "FASE 2/.env.example"
      - ".github/workflows/qa-integracion-base.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-integracion-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Compilar y probar backend
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: "FASE 2/backend/pom.xml"

      - name: Verificar backend y arquitectura
        working-directory: "FASE 2/backend"
        run: ./mvnw --batch-mode clean verify

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          path: "FASE 2/backend/target/surefire-reports/"
          if-no-files-found: warn
          retention-days: 14

  smoke-platform:
    name: Construir y probar plataforma con Compose
    needs: test-backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: "FASE 2"
    env:
      BACKEND_PORT: "8080"
      POSTGRES_DB: ${{ secrets.SGO_POSTGRES_DB || 'sgo_logic_ci' }}
      POSTGRES_USER: ${{ secrets.SGO_POSTGRES_USER || 'sgo_ci' }}
      POSTGRES_PASSWORD: ${{ secrets.SGO_POSTGRES_PASSWORD || 'ci_postgres_only' }}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RABBITMQ_USER: ${{ secrets.SGO_RABBITMQ_USER || 'sgo_ci' }}
      RABBITMQ_PASSWORD: ${{ secrets.SGO_RABBITMQ_PASSWORD || 'ci_rabbitmq_only' }}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_MANAGEMENT_PORT: "15672"
      SPRING_PROFILES_ACTIVE: local

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Construir y ejecutar smoke test
        run: ./tests/smoke/verify-platform.sh --skip-maven

      - name: Apagar servicios residuales
        if: always()
        run: docker compose down
