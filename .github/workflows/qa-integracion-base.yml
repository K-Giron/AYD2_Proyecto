name: QA - Integracion base Fase 2

on:
  pull_request:
    paths:
      - "FASE 2/backend/**"
      - "FASE 2/tests/smoke/**"
      - "FASE 2/docker-compose.yml"
      - "FASE 2/.env.example"
      - ".github/workflows/qa-integracion-base.yml"
  push:
    branches:
      - develop
      - main
    paths:
      - "FASE 2/backend/**"
      - "FASE 2/tests/smoke/**"
      - "FASE 2/docker-compose.yml"
      - "FASE 2/.env.example"
      - ".github/workflows/qa-integracion-base.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-integracion-base-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-platform:
    name: Maven, arquitectura e infraestructura
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: "FASE 2"
    env:
      BACKEND_PORT: "8080"
      POSTGRES_DB: ${{ secrets.SGO_POSTGRES_DB }}
      POSTGRES_USER: ${{ secrets.SGO_POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.SGO_POSTGRES_PASSWORD }}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      RABBITMQ_USER: ${{ secrets.SGO_RABBITMQ_USER }}
      RABBITMQ_PASSWORD: ${{ secrets.SGO_RABBITMQ_PASSWORD }}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_MANAGEMENT_PORT: "15672"
      SPRING_PROFILES_ACTIVE: local

    steps:
      - name: Obtener repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: "FASE 2/backend/pom.xml"

      - name: Validar secretos requeridos
        shell: bash
        run: |
          required=(POSTGRES_DB POSTGRES_USER POSTGRES_PASSWORD RABBITMQ_USER RABBITMQ_PASSWORD)
          for variable_name in "${required[@]}"; do
            if [[ -z "${!variable_name}" ]]; then
              echo "Falta configurar el secreto asociado a ${variable_name}." >&2
              exit 1
            fi
          done

      - name: Verificar backend y arquitectura
        working-directory: "FASE 2/backend"
        run: ./mvnw --batch-mode clean verify

      - name: Ejecutar smoke test de plataforma
        run: ./tests/smoke/verify-platform.sh --skip-maven

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ github.run_id }}
          path: "FASE 2/backend/target/surefire-reports/"
          if-no-files-found: warn
          retention-days: 14

      - name: Apagar servicios residuales
        if: always()
        run: docker compose down
